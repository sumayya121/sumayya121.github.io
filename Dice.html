    <h1>Roll Dice</h1>

 <div>  Dice Roll 4 side:
    <input type="text" id="dice4" value="4">
    <img src="https://tse1.mm.bing.net/th/id/OIP.1T1W11JtbZr83NLmFbqK2QHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"

    <script>
        function rollDice4()
        {
            var dice4 = Math.floor((Math.random() * 4) + 1);
            document.getElementById("dice4").value = dice4;
        }
    </script>
